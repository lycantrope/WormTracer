[project]
name = "WormTracer"
version = "20.6.5"
description = "WormTracer package"
authors = [
    { name = "Koyo Kuze" },
    { name = "Ukyo T. Tazawa" },
    { name = "Karin Suwazono" },
    { name = "Chung-Kuan Chen", email = "b97b01045@gmail.com" },
    { name = "Yu Toyoshima" },
    { name = "Yuichi Iino", email = "iino@bs.s.u-tokyo.ac.jp" },
]
dependencies = [
    "numpy<2",
    "opencv-python-headless",
    "matplotlib",
    "Pillow",
    "scikit-image",
    "scipy",
    "pyyaml",
    "roifile[all]>=2020.11.28",
]
readme = "README.md"

[project.scripts]
wormtracer = "WormTracer.__main__:main"

[build-system]
requires = ["setuptools", "wheel", "hatchling"]


[tool.ruff.lint]
extend-select = ["I001"]
ignore = ["F401", "F405"]
